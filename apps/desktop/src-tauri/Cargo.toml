[package]
name = "personal-island-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "personal_island_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy", "json", "blocking"] }
task-core = { path = "../../../crates/task-core" }
tokio.workspace = true
sqlx.workspace = true
chrono.workspace = true
base64 = "0.22"
sha2 = "0.10"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Storage_Streams", "Foundation", "Win32_Foundation", "Win32_Media_Audio", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_Packaging_Appx", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast"] }
futures-util = "0.3"
x11rb = { version = "0.13.2", features = ["xtest"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Media_Playback", "Media_Core", "Storage", "Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
