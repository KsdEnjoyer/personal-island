name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/audit-release.py
      - run: python scripts/install-gitleaks.py
      - run: .local/tools/gitleaks git --redact=100 --no-banner --log-opts='--all'
      - run: npm --prefix apps/desktop ci --ignore-scripts
      - run: npm --prefix apps/desktop audit --omit=dev --audit-level=high
      - run: python scripts/audit-npm.py
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit --no-yanked
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r services/mcp-gateway/requirements.txt
