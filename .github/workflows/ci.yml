name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm.cmd --prefix apps/desktop ci
      - run: npm.cmd --prefix apps/desktop run check
      - run: npm.cmd --prefix apps/desktop run build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p task-core
      - run: cargo test --locked -p task-mcp --features http
      - run: cargo test --locked -p personal-island-desktop --lib
      - run: npm.cmd --prefix apps/desktop run tauri -- build --debug --no-bundle
  portable-mcp-and-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo test --locked -p task-core
      - run: cargo test --locked -p task-mcp --features http
      - run: python -m pip install -r services/mcp-gateway/requirements.txt pytest
      - run: python -m pytest services/mcp-gateway -q
      - run: python scripts/audit-release.py
